[project]
name = "projector-server"
version = "0.1.0"
description = "Synced window projection control server"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.21",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "opencv-contrib-python-headless>=4.9",
    "scenedetect>=0.6.5,<0.7",
    "zeroconf>=0.132",
    "qrcode[pil]>=7.4",
    "pillow>=10.3",
    "websockets>=12.0",
]

[dependency-groups]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
