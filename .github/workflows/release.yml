name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PROJECTOR_WORK_DIR: ${{ github.workspace }}/.ci-work
      PROJECTOR_SOURCE_ROOT: ${{ github.workspace }}/.ci-source
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.10"
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Validate release secrets
        env:
          KEYSTORE: ${{ secrets.PROJECTOR_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PROJECTOR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PROJECTOR_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PROJECTOR_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"

      - working-directory: server
        run: uv sync --locked && uv run pytest -q
      - working-directory: web
        run: npm ci && npm run build
      - run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Build signed APK
        env:
          PROJECTOR_KEYSTORE_BASE64: ${{ secrets.PROJECTOR_KEYSTORE_BASE64 }}
          PROJECTOR_KEYSTORE_PASSWORD: ${{ secrets.PROJECTOR_KEYSTORE_PASSWORD }}
          PROJECTOR_KEY_ALIAS: ${{ secrets.PROJECTOR_KEY_ALIAS }}
          PROJECTOR_KEY_PASSWORD: ${{ secrets.PROJECTOR_KEY_PASSWORD }}
        run: |
          printf '%s' "$PROJECTOR_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/projector-release.jks"
          export PROJECTOR_KEYSTORE="$RUNNER_TEMP/projector-release.jks"
          export PROJECTOR_VERSION_CODE=$((30000000 + GITHUB_RUN_NUMBER))
          export PROJECTOR_VERSION_NAME="${GITHUB_REF_NAME#v}"
          gradle -p android --no-daemon testDebugUnitTest assembleRelease
          cp android/app/build/outputs/apk/release/app-release.apk "projector-${GITHUB_REF_NAME}.apk"
          sha256sum "projector-${GITHUB_REF_NAME}.apk" > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            projector-${{ github.ref_name }}.apk
            SHA256SUMS.txt
